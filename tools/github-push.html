<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Push GitHub v30</title>
<style>body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;padding:1.5rem;max-width:760px;margin:auto}h1{color:#58a6ff}label{display:block;margin:.8rem 0 .3rem;color:#8b949e;font-size:.85rem}input,textarea,select{width:100%;padding:.7rem;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-family:monospace}button{margin-top:1rem;padding:.8rem 1.4rem;background:#238636;border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer}pre{background:#161b22;padding:1rem;border-radius:8px;overflow:auto;font-size:.75rem;white-space:pre-wrap}.ok{color:#3fb950}.ko{color:#f85149}</style></head><body>
<h1>📤 Push fichiers vers GitHub (v30)</h1>
<p style="color:#8b949e;font-size:.85rem">Collez un <strong>Personal Access Token</strong> (scopes : <code>repo</code>). Il n'est <strong>jamais stocké</strong> (mémoire seule). Sélectionnez les fichiers à pousser ; le contenu est lu depuis votre dépôt local via fetch (servez le dossier en HTTP, ex : <code>npx serve</code>).</p>
<label>Token (ghp_...)</label><input type="password" id="tok" placeholder="ghp_xxxxxxxxxxxx">
<label>Owner / Repo</label><input id="repo" value="expertkevin06-cell/etude-incendie-by-kevin">
<label>Branche</label><input id="branch" value="main">
<label>Fichiers à pousser</label>
<select id="files" multiple size="14" style="height:240px">
<option value="index.html">index.html</option><option value="manifest.json">manifest.json</option><option value="service-worker.js">service-worker.js</option>
<option value="css/styles.css">css/styles.css</option><option value="js/data.js">js/data.js</option><option value="js/engine.js">js/engine.js</option>
<option value="js/search-v25.js">js/search-v25.js</option><option value="js/mega-pannes.js">js/mega-pannes.js</option><option value="js/legal-auto.js">js/legal-auto.js</option>
<option value="js/app.js">js/app.js</option><option value="js/fiches-techniques.js">js/fiches-techniques.js</option>
<option value="data/recalls-feed.json">data/recalls-feed.json</option><option value="images/icon.svg">images/icon.svg</option>
<option value="tools/autodiag.html">tools/autodiag.html</option><option value="tools/fetch-recalls.mjs">tools/fetch-recalls.mjs</option>
<option value="tools/github-push.html">tools/github-push.html</option><option value="tools/generate-icons.html">tools/generate-icons.html</option>
<option value="tools/upload-icons-github.html">tools/upload-icons-github.html</option>
<option value=".github/workflows/monthly-recalls.yml">.github/workflows/monthly-recalls.yml</option><option value="README.md">README.md</option>
</select>
<button onclick="push()">🚀 Pousser la sélection</button>
<pre id="log"></pre>
<script>
const L=document.getElementById('log');function log(m,c){L.innerHTML+='<span class="'+(c||'')+'">'+m+'</span>\n';L.scrollTop=L.scrollHeight;}
async function sha(content){const buf=new TextEncoder().encode(content);const h=await crypto.subtle.digest('SHA-1',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');}
async function push(){const tok=document.getElementById('tok').value.trim();const repo=document.getElementById('repo').value.trim();const branch=document.getElementById('branch').value.trim()||'main';
 const sel=Array.from(document.getElementById('files').selectedOptions).map(o=>o.value);
 if(!tok||!repo||!sel.length){log('❌ Token, repo et au moins un fichier requis.','ko');return;}
 log('▶ '+sel.length+' fichier(s) → '+repo+'@'+branch);
 for(const path of sel){
  try{
   const local=await fetch('../'+path,{cache:'no-store'});if(!local.ok){log('⚠️ Local absent : '+path+' ('+local.status+') — ignoré','warn');continue;}
   const content=await local.text();
   const api='https://api.github.com/repos/'+repo+'/contents/'+encodeURIComponent(path);
   let sha=null;
   const get=await fetch(api,{headers:{Authorization:'token '+tok,Accept:'application/vnd.github+json'}});
   if(get.ok){const j=await get.json();sha=j.sha;}
   const body={message:'v30 update '+path+' ('+new Date().toISOString().slice(0,10)+')',content:btoa(unescape(encodeURIComponent(content))),branch:branch};
   if(sha)body.sha=sha;
   const put=await fetch(api,{method:sha?'PUT':'PUT',headers:{Authorization:'token '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
   if(put.ok||put.status===201){log('✅ '+path+' poussé','ok');}
   else{const t=await put.text();log('❌ '+path+' → HTTP '+put.status+' : '+t.slice(0,160),'ko');}
  }catch(e){log('❌ '+path+' : '+e.message,'ko');}
 }
 log('✔ Terminé. Supprimez le token de l’historique du champ.');document.getElementById('tok').value='';}
</script></body></html>
