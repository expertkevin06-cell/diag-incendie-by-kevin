<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Générateur d'icônes v30</title>
<style>body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;padding:1.5rem;max-width:900px;margin:auto}h1{color:#58a6ff}canvas{background:#3a0710;border-radius:12px;margin:.3rem;vertical-align:top}.row{display:flex;flex-wrap:wrap}button{margin:.6rem .4rem;padding:.7rem 1.2rem;background:#238636;border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer}pre{background:#161b22;padding:1rem;border-radius:8px;overflow:auto;font-size:.7rem;max-height:240px}</style></head><body>
<h1>🎨 Générateur d'icônes (PNG multi-tailles)</h1>
<p style="color:#8b949e">Dessine l'icône (flamme + voiture + texte) aux tailles manifest, produit les PNG, les stocke dans <code>localStorage</code> pour l'outil d'upload, et propose le téléchargement unitaire/zip-manifest.</p>
<div class="row" id="preview"></div>
<button onclick="dlAll()">⬇️ Tout télécharger (liste URLs)</button>
<button onclick="copyJson()">📋 Copier JSON pour upload</button>
<pre id="out"></pre>
<script>
const SIZES=[72,96,128,144,152,192,384,512,1024];
const SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6f00"/><stop offset="1" stop-color="#b71c1c"/></linearGradient></defs><rect width="512" height="512" rx="96" fill="url(#g)"/><path d="M256 70c40 60 10 90 30 130 30-20 40-60 40-60 30 50 20 120-30 160-10 60-70 90-130 70-50-16-70-70-50-120 10 30 30 40 30 40-10-60 20-110 70-150 0 0-10 40 10 60 10-40 10-80 30-130z" fill="#fff" opacity=".95"/><path d="M120 360h272l-20 60H140z" fill="#212121"/><circle cx="170" cy="420" r="26" fill="#000"/><circle cx="170" cy="420" r="10" fill="#bbb"/><circle cx="342" cy="420" r="26" fill="#000"/><circle cx="342" cy="420" r="10" fill="#bbb"/><text x="256" y="486" font-family="Arial" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">KEVIN</text></svg>';
function draw(size,maskable){return new Promise(res=>{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
 const pad=maskable?size*0.12:0;const img=new Image();img.onload=()=>{x.fillStyle='#3a0710';x.fillRect(0,0,size,size);x.drawImage(img,pad,pad,size-2*pad,size-2*pad);res(c.toDataURL('image/png'));};img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(SVG)));});}
async function gen(){const prev=document.getElementById('preview');prev.innerHTML='';const store={};
 for(const s of SIZES){const url=await draw(s,false);const murl=await draw(s,true);store['icon-'+s+'x'+s+'.png']=url;if(s===192||s===512)store['icon-'+s+'x'+s+'-maskable.png']=murl;
  const im=document.createElement('img');im.src=url;im.width=im.height=Math.min(s,120);im.title=s+'px';prev.appendChild(im);}
 store['apple-touch-icon.png']=await draw(180,false);store['icon.svg']='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(SVG)));
 localStorage.setItem('generatedIcons',JSON.stringify(store));
 document.getElementById('out').textContent='✅ '+Object.keys(store).length+' icônes générées + stockées (localStorage.generatedIcons).';}
function dlAll(){const st=JSON.parse(localStorage.getItem('generatedIcons')||'{}');let txt='';for(const k in st){const a=document.createElement('a');a.href=st[k];a.download=k;a.click();txt+=k+'\n';}document.getElementById('out').textContent='⬇️ Téléchargements lancés :\n'+txt;}
function copyJson(){const st=localStorage.getItem('generatedIcons')||'{}';navigator.clipboard.writeText(st).then(()=>{document.getElementById('out').textContent='📋 JSON copié → collez dans upload-icons-github.html (ou il lit déjà localStorage).';}).catch(()=>{document.getElementById('out').textContent='Copie impossible ; JSON présent dans localStorage.generatedIcons';});}
gen();
</script></body></html>
